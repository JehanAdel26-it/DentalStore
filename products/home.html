<div id="heroSlider" class="carousel slide mt-4" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#heroSlider" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner rounded shadow">

        <div class="carousel-item active">
            <img src="{% static 'images/slider1.jpg' %}" class="d-block w-100" height="500">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider2.jpg' %}" class="d-block w-100" height="500">
        </div>

        <div class="carousel-item">
            <img src="{% static 'images/slider3.jpg' %}" class="d-block w-100" height="500">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroSlider" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#heroSlider" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>
