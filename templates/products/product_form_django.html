{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2 class="mb-4">Django Form</h2>

    {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            إرسال
        </button>

    </form>

</div>

{% endblock %}
