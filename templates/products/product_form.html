{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2 class="mb-4">
        {{ title }}
    </h2>

    <div class="card shadow p-4">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">
                حفظ
            </button>

            <a
                href="{% url 'product_list' %}"
                class="btn btn-secondary"
            >
                إلغاء
            </a>

        </form>

    </div>

</div>

{% endblock %}
