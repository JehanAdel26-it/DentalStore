{% extends 'base.html' %}

{% block title %}
تسجيل الدخول | DentalStore
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-user-circle fa-4x text-primary"></i>

                        <h2 class="mt-3">
                            تسجيل الدخول
                        </h2>

                        <p class="text-muted">
                            مرحباً بك في DentalStore
                        </p>

                    </div>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-info">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                اسم المستخدم
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="أدخل اسم المستخدم"
                                required>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                كلمة المرور
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="أدخل كلمة المرور"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            <i class="fa-solid fa-right-to-bracket"></i>

                            تسجيل الدخول

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p>
                            ليس لديك حساب؟
                            <a href="{% url 'account_register' %}">
                                إنشاء حساب جديد
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
